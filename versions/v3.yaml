esphome:
  name: test
  friendly_name: test
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      # 检测 USB 供电状态（电压 > 4.1V 视为通电）
      - if:
          condition:
            lambda: "return id(battery_voltage).state > 4.1;"
          then:
            - logger.log: "USB power detected - continuous refresh mode"
            - lambda: "id(is_plugged_in) = true;"
            # USB 通电：等待 WiFi 和 HA 连接
            - wait_until:
                condition:
                  wifi.connected
                timeout: 30s
            - delay: 3s   # 等 HA API 连接建立完成，状态自动同步
            - component.update: epaper_display
            - logger.log: "🖥️ [刷新] USB通电模式，触发墨水屏刷新"
            - deep_sleep.prevent: deep_sleep_1  # USB 通电：立即阻止休眠
          else:
            - logger.log: "Battery powered - normal mode"
            - lambda: "id(is_plugged_in) = false;"
            # 电池供电：等待 WiFi 和 HA
            - wait_until:
                condition:
                  wifi.connected
                timeout: 30s
            - delay: 3s
            - component.update: epaper_display
            - logger.log: "🖥️ [刷新] 电池模式，触发墨水屏刷新"
            # 电池模式：渲染完成后允许 deep_sleep 正常接管
            - deep_sleep.allow: deep_sleep_1

esp32:
  #variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  baud_rate: 0
# Enable Home Assistant API
api:
  encryption:
    key: "3Uv+97+HusMDIBwwIvvKnUALbzhrUfgCH1NkRENi1mk="

ota:
  - platform: esphome
    password: "5e76576e3150643a3c14826fd3a7a1d6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Test Fallback Hotspot"
    password: "BuytCkj3TkEc"

captive_portal:

# Deep-sleep: 由 interval 控制何时休眠
# USB 通电时 interval 阻止休眠
# 电池供电时正常进入 deep_sleep
deep_sleep:
  id: deep_sleep_1
  sleep_duration: 5min
  wakeup_pin: GPIO2
  wakeup_pin_mode: INVERT_WAKEUP

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  - file: "gfonts://Noto+Sans+SC"
    id: small_font
    size: 24
    bpp: 4
    glyphs: "户外温度雾多云转晴雨雷大风刘剑复习预打卡练钢琴老师任务足球队课训樱桃文英语数向享学唱歌书法今天明待办重要近日程气俏童做作业买菜家字化解决方案设计生未来小时口算ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:：°/，。,.[]%•| ✓○"

  - file: "gfonts://Noto+Sans+SC"
    id: mid_font
    size: 28
    bpp: 4
    glyphs: "天气重要待办近日程ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:°/ "

  - file: "fonts/Inter_18pt-Bold.ttf"
    id: big_font
    size: 100
    glyphs: "0123456789.-° "

  - file: "fonts/Inter_18pt-Bold.ttf"
    id: time_font
    size: 72
    glyphs: "0123456789: "

  - file: 'fonts/materialdesignicons-webfont.ttf'
    id: font_bat_icon
    size: 24
    glyphs:
      - "\U000F007A"
      - "\U000F007B"
      - "\U000F007C"
      - "\U000F007D"
      - "\U000F007E"
      - "\U000F007F"
      - "\U000F0080"
      - "\U000F0081"
      - "\U000F0082"
      - "\U000F0079"

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: weather_icon_font
    size: 72
    glyphs:
      - "\U000F0599"
      - "\U000F0595"
      - "\U000F0F2F"
      - "\U000F0597"
      - "\U000F0598"
      - "\U000F059B"
      - "\U000F0594"
      - "\U000F0596"

globals:
  - id: page_index
    type: int
    restore_value: true
    initial_value: '0'

  - id: battery_glyph
    type: std::string
    restore_value: no
    initial_value: "\"\\U000F0079\""

  - id: needs_update
    type: bool
    restore_value: true
    initial_value: 'true'

  # USB 供电检测：电压 > 4.1V 视为通电
  - id: is_plugged_in
    type: bool
    restore_value: false
    initial_value: 'false'

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0

  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    on_value:
      then:
        - lambda: |-
            int pct = int(x);
            if (pct <= 10)      id(battery_glyph) = "\U000F007A";
            else if (pct <= 20) id(battery_glyph) = "\U000F007B";
            else if (pct <= 30) id(battery_glyph) = "\U000F007C";
            else if (pct <= 40) id(battery_glyph) = "\U000F007D";
            else if (pct <= 50) id(battery_glyph) = "\U000F007E";
            else if (pct <= 60) id(battery_glyph) = "\U000F007F";
            else if (pct <= 70) id(battery_glyph) = "\U000F0080";
            else if (pct <= 80) id(battery_glyph) = "\U000F0081";
            else if (pct <= 90) id(battery_glyph) = "\U000F0082";
            else                id(battery_glyph) = "\U000F0079";
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_battery_enable

binary_sensor:
  # 按键翻页
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key2
    name: "Key2"
    on_press:
      then:
        - lambda: |
            id(page_index) = (id(page_index) - 1 + 2) % 2;
            id(epaper_display).update();
            ESP_LOGI("key", "🔘 [按键] 手动切换页面");

# Home Assistant 时间同步 + 定时更新
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - hours: [7, 12, 18, 19, 20, 21, 22]
        minutes: 0
        seconds: 0
        then:
          - if:
              condition:
                lambda: "return id(is_plugged_in);"
              then:
                # USB 通电：立即刷新
                - logger.log: "Scheduled refresh - USB mode"
                - wait_until:
                    condition:
                      wifi.connected
                    timeout: 10s
                - delay: 500ms
                - component.update: epaper_display
              else:
                # 电池供电：设置标志等唤醒刷新
                - logger.log: "⏰ [定时] 电池供电，设置 needs_update=true，等待下次唤醒刷新"
                - lambda: "id(needs_update) = true;"

# =====================================================
# Interval：USB 通电时每分钟刷新，电池时触发更新后休眠
# =====================================================
interval:
  - interval: 60s
    then:
      # USB 通电：持续每分钟刷新屏幕，阻止 deep_sleep
      - if:
          condition:
            lambda: "return id(is_plugged_in);"
          then:
            - logger.log: "Plugged in - refresh display"
            - wait_until:
                condition:
                  wifi.connected
                timeout: 10s
            - delay: 500ms   # 等 HA 数据同步
            - logger.log: "⏰ [Interval] USB通电，每分钟刷新墨水屏"
            - component.update: epaper_display
            - deep_sleep.prevent: deep_sleep_1
          else:
            - logger.log: "🔌 [Interval] 电池供电，允许进入deep_sleep"
            - deep_sleep.allow: deep_sleep_1

# =====================================================
# Home Assistant 数据源
# =====================================================
text_sensor:
  - platform: homeassistant
    entity_id: weather.he_feng_tian_qi_2
    id: my_weather

  - platform: homeassistant
    entity_id: weather.he_feng_tian_qi_2
    id: weather_temp
    attribute: "temperature"

  - platform: homeassistant
    entity_id: sensor.esp_todo_list
    id: todo_list

  - platform: homeassistant
    entity_id: sensor.esp_48_schedule
    id: schedule_48h


display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    update_interval: never
    lambda: |-
      // ================= 自动检测缺失字符 =================
      std::string all_text = "";
      all_text += id(my_weather).state;
      all_text += id(weather_temp).state;
      all_text += id(todo_list).state;
      all_text += id(schedule_48h).state;
      all_text += "天气待办未来48小时°C";

      std::string allowed = "户外温度雾多云转晴雨雷大风刘剑复习预打卡练钢琴老师任务足球队课训樱桃文英语数向享学唱歌书法今天明待办重要近日程气俏童做作业买菜家字化解决方案设计生未来小时口算ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:：°/，。,.[]%•| ✓○";

      std::string missing = "";
      for (size_t i = 0; i < all_text.length(); ) {
        size_t char_len = 1;
        unsigned char c = all_text[i];
        if ((c & 0x80) == 0) char_len = 1;
        else if ((c & 0xE0) == 0xC0) char_len = 2;
        else if ((c & 0xF0) == 0xE0) char_len = 3;
        else if ((c & 0xF8) == 0xF0) char_len = 4;
        std::string ch = all_text.substr(i, char_len);
        if (allowed.find(ch) == std::string::npos) {
          if (missing.find(ch) == std::string::npos) missing += ch;
        }
        i += char_len;
      }
      if (!missing.empty()) {
        ESP_LOGW("glyph_check", "⚠️ 字体缺失字符: %s", missing.c_str());
      }
      // ================================================

      const int divider_x = 320;
      it.fill(COLOR_OFF);

      // 电池图标
      it.printf(680, 10, id(font_bat_icon), "%s", id(battery_glyph).c_str());
      it.printf(710, 10, id(small_font), "%.0f%%", id(battery_level).state);

      // 分隔线
      it.line(divider_x, 20, divider_x, 460);

      // ========== 左侧天气 ==========
      std::string weather_condition = id(my_weather).state;
      std::string weather_icon = "\U000F0599";

      if (weather_condition == "partlycloudy") {
        weather_icon = "\U000F0595";
        weather_condition = "晴转多云";
      } else if (weather_condition == "cloudy") {
        weather_icon = "\U000F0F2F";
        weather_condition = "多云";
      } else if (weather_condition == "rainy") {
        weather_icon = "\U000F0597";
        weather_condition = "雨";
      } else if (weather_condition == "snowy") {
        weather_icon = "\U000F0598";
        weather_condition = "雪";
      } else if (weather_condition == "windy") {
        weather_icon = "\U000F059B";
        weather_condition = "大风";
      } else if (weather_condition == "fog") {
        weather_icon = "\U000F0594";
        weather_condition = "雾";
      } else if (weather_condition == "lightning") {
        weather_icon = "\U000F0596";
        weather_condition = "雷雨";
      }

      it.printf(160, 30, id(small_font), TextAlign::TOP_CENTER, weather_condition.c_str());
      it.printf(160, 150, id(weather_icon_font), TextAlign::CENTER, "%s", weather_icon.c_str());
      it.printf(160, 250, id(small_font), TextAlign::CENTER, "%s", "户外温度");

      float temp_c = atof(id(weather_temp).state.c_str());
      it.printf(160, 360, id(big_font), TextAlign::CENTER, "%.0f", temp_c);
      it.printf(245, 315, id(mid_font), TextAlign::CENTER, "°C");

      // ========== 右侧待办 ==========
      it.printf(560, 20, id(mid_font), TextAlign::TOP_CENTER, "重要待办");
      it.line(350, 60, 780, 60);

      std::string todos = id(todo_list).state;
      int pos_nl = 0;
      while ((pos_nl = todos.find('\n', pos_nl)) != std::string::npos) {
        todos.replace(pos_nl, 1, "");
      }
      int todo_y = 80;
      int line_height = 30;
      int line_count = 0;
      size_t pos = 0;

      while (line_count < 5) {
        size_t next = todos.find('|', pos);
        std::string line = (next == std::string::npos) ? todos.substr(pos) : todos.substr(pos, next - pos);
        if (line.length() > 0) {
          if (line.length() > 22) line = line.substr(0, 22) + "...";
          it.printf(360, todo_y, id(small_font), TextAlign::TOP_LEFT, "• %s", line.c_str());
          todo_y += line_height;
          line_count++;
        }
        if (next == std::string::npos) break;
        pos = next + 1;
      }

      // ========== 日程 ==========
      it.printf(560, 230, id(mid_font), TextAlign::TOP_CENTER, "近2天日程");
      it.line(350, 270, 780, 270);

      std::string schedules = id(schedule_48h).state;
      int sch_y = 290;
      line_count = 0;
      pos = 0;

      while (line_count < 5) {
        size_t next = schedules.find('|', pos);
        std::string line = (next == std::string::npos) ? schedules.substr(pos) : schedules.substr(pos, next - pos);
        if (line.length() > 0) {
          if (line.length() > 38) line = line.substr(0, 38) + "...";
          it.printf(360, sch_y, id(small_font), TextAlign::TOP_LEFT, "%s", line.c_str());
          sch_y += line_height;
          line_count++;
        }
        if (next == std::string::npos) break;
        pos = next + 1;
      }