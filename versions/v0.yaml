esphome:
  name: test
  friendly_name: test
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      # 每次唤醒时检查是否需要更新数据
      - if:
          condition:
            lambda: "return id(needs_update);"
          then:
            - lambda: "id(needs_update) = false;"
            - component.update: epaper_display

esp32:
  #variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
psram:
  mode: octal
  speed: 80MHz

# Enable logging
